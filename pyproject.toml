[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "author-avatar"
version = "0.1.0"
description = "An AI author interpretation grounded in Autobiography of a Yogi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<0.29",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.43,<2",
    "python-dotenv>=1.2,<2",
]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
